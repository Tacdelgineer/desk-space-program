<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desk Space Program</title>
<meta name="description" content="Interactive missions that open up a machine and show what really limits running AI on it.">
<meta name="theme-color" content="#1b1712">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/themes/screenprint.css">
<style>
/* hub page only: the theme is built for a full-screen app, this one scrolls */
html{height:auto;min-height:100%}
body{height:auto;min-height:100%;overflow:auto}
.hub{max-width:44rem;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px 48px}
.hub h1{margin:0 0 18px;font-family:var(--display);font-weight:400;font-size:clamp(3rem,10vw,5.6rem);line-height:.92;letter-spacing:.005em;text-transform:uppercase;-webkit-mask-image:var(--wear);mask-image:var(--wear);-webkit-mask-size:240px;mask-size:240px}
.hub h1 span{display:block}
.hub h1 .l1{color:var(--on-stage);text-shadow:3px 3px 0 var(--red)}
.hub h1 .l2{color:var(--yellow);text-shadow:3px 3px 0 var(--red)}
.hub .sticker{max-width:32rem;margin-bottom:34px}
.missions{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.missions li,.missions a{display:grid;grid-template-columns:2.6rem 1fr auto;gap:0 14px;align-items:center;padding:12px 16px 13px;background:var(--paper) var(--grain);background-blend-mode:multiply;color:var(--ink);border:2.5px solid var(--ink);box-shadow:var(--shadow);text-decoration:none}
.missions li{opacity:.62;box-shadow:4px 4px 0 var(--ink)}
.missions li.live{display:block;padding:0;opacity:1;background:none;border:0;box-shadow:none}
.missions li.live a{transform:rotate(-.4deg)}
.missions li.live a:hover{background-color:var(--paper-2);transform:translate(-2px,-2px) rotate(-.4deg);box-shadow:7px 7px 0 var(--red)}
.missions li.live a:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
.missions .n{font-family:var(--display);font-size:1.9rem;line-height:1;color:var(--ink-soft)}
.missions li.live .n{color:var(--red)}
.missions .t{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.05;letter-spacing:.01em;text-transform:uppercase}
.missions .q{display:block;margin-top:2px;color:var(--ink-soft)}
.missions .tag{font-family:var(--mono);font-size:.72rem;font-weight:500;padding:3px 7px;border:1.5px solid var(--ink);text-transform:uppercase;letter-spacing:.04em}
.missions li.live .tag{background:var(--red);border-color:var(--red);color:var(--paper)}
@media (max-width:520px){ .missions li,.missions a{grid-template-columns:2.2rem 1fr;} .missions .tag{grid-column:2;justify-self:start;margin-top:8px} }
</style>
</head>
<body>
<main class="hub">
  <h1><span class="l1">Desk Space</span><span class="l2">Program</span></h1>
  <p class="sticker">Interactive missions that open up a machine and show what really limits running AI on it. Mission 01 is live. The rest are coming.</p>
  <ol class="missions">
<!--missions-->
  </ol>
</main>
</body>
</html>
